name: PEP8 Code Validation

on: [push]

jobs:
  pep8-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install pycodestyle
        run: pip install pycodestyle
      - name: Run pycodestyle validation
        run: pycodestyle . --exclude=.venv --count --statistics